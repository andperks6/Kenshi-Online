name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag to publish (leave blank to upload as workflow artifact only)'
        required: false
        default: ''

permissions:
  contents: write
  packages: write

jobs:
  build-windows:
    name: Windows client + server zip
    runs-on: windows-latest

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure (MSVC x64 Release)
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Run unit tests
        run: build\bin\Release\KenshiMP.UnitTest.exe

      - name: Stage release payload
        shell: pwsh
        run: |
          $stage = "release/Kenshi-Online"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null

          # Built binaries (must exist)
          $binaries = @(
            "build/bin/Release/KenshiMP.Core.dll",
            "build/bin/Release/KenshiMP.Injector.exe",
            "build/bin/Release/KenshiMP.Server.exe",
            "build/bin/Release/KenshiMP.MasterServer.exe"
          )
          foreach ($f in $binaries) {
            if (-not (Test-Path $f)) { throw "Missing build artifact: $f" }
            Copy-Item $f $stage
          }

          # Game assets shipped from the repo (must exist)
          $assets = @(
            "kenshi-online.mod",
            "dist/Kenshi_MainMenu.layout",
            "dist/Kenshi_MultiplayerPanel.layout",
            "dist/Kenshi_MultiplayerHUD.layout",
            "dist/server.json",
            "dist/JOINING.md",
            "dist/uninstall.bat",
            "install.bat"
          )
          foreach ($f in $assets) {
            if (-not (Test-Path $f)) { throw "Missing asset: $f" }
            Copy-Item $f $stage
          }

          Get-ChildItem $stage | Format-Table Name, Length

      - name: Zip release payload
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ([string]::IsNullOrWhiteSpace("${{ inputs.tag_name }}") -eq $false) {
            $tag = "${{ inputs.tag_name }}"
          }
          if ([string]::IsNullOrWhiteSpace($tag) -or $tag -eq "main") {
            $tag = "dev-$(Get-Date -Format yyyyMMdd-HHmmss)"
          }
          $zip = "Kenshi-Online-$tag.zip"
          # Zip the folder itself so extraction creates a Kenshi-Online/ dir
          # rather than dumping files into wherever the user extracted.
          Compress-Archive -Path "release/Kenshi-Online" -DestinationPath $zip -Force
          "ZIP_NAME=$zip"  | Out-File -FilePath $env:GITHUB_ENV -Append
          "ZIP_PATH=$zip"  | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload Windows zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: ${{ env.ZIP_PATH }}
          if-no-files-found: error

      - name: Publish GitHub Release (Windows zip)
        if: startsWith(github.ref, 'refs/tags/v') || inputs.tag_name != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name != '' && inputs.tag_name || github.ref_name }}
          name: ${{ inputs.tag_name != '' && inputs.tag_name || github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: ${{ env.ZIP_PATH }}
          fail_on_unmatched_files: true

  build-linux-server:
    name: Linux server tarball
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build server + master server
        run: cmake --build build --config Release --parallel

      - name: Stage Linux payload
        run: |
          set -eu
          stage=release/Kenshi-Online-Server-linux-x64
          mkdir -p "$stage"
          cp build/bin/KenshiMP.Server "$stage/"
          cp build/bin/KenshiMP.MasterServer "$stage/"
          # Ship the docker recipes (compose, Unraid template, README) so
          # someone with the tarball doesn't need to clone the repo to
          # spin up a container.
          cp -r dist/server-docker "$stage/server-docker"
          ls -la "$stage" "$stage/server-docker"

      - name: Tarball Linux payload + standalone server-docker zip
        id: tar
        run: |
          set -eu
          tag="${{ inputs.tag_name != '' && inputs.tag_name || github.ref_name }}"
          if [ -z "$tag" ] || [ "$tag" = "main" ]; then
            tag="dev-$(date -u +%Y%m%d-%H%M%S)"
          fi

          tar="Kenshi-Online-Server-${tag}-linux-x64.tar.gz"
          tar -C release -czf "$tar" "Kenshi-Online-Server-linux-x64"

          # Smaller standalone docker-recipes zip for users who don't
          # want the Linux binaries (e.g. Unraid users pulling the GHCR
          # image and just needing the XML template + compose files).
          docker_zip="Kenshi-Online-server-docker-${tag}.zip"
          (cd dist && zip -r "../${docker_zip}" server-docker)

          echo "TAR_NAME=$tar"  >> "$GITHUB_ENV"
          echo "TAR_PATH=$tar"  >> "$GITHUB_ENV"
          echo "DOCKER_ZIP_NAME=$docker_zip" >> "$GITHUB_ENV"
          echo "DOCKER_ZIP_PATH=$docker_zip" >> "$GITHUB_ENV"
          ls -la "$tar" "$docker_zip"

      - name: Upload Linux tarball artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.TAR_NAME }}
          path: ${{ env.TAR_PATH }}
          if-no-files-found: error

      - name: Upload server-docker zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.DOCKER_ZIP_NAME }}
          path: ${{ env.DOCKER_ZIP_PATH }}
          if-no-files-found: error

      - name: Attach Linux tarball + docker zip to Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.tag_name != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name != '' && inputs.tag_name || github.ref_name }}
          files: |
            ${{ env.TAR_PATH }}
            ${{ env.DOCKER_ZIP_PATH }}
          fail_on_unmatched_files: true

  build-docker:
    name: Docker server image (GHCR)
    runs-on: ubuntu-latest
    # Always build to validate the Dockerfile. Push to GHCR only on real
    # tag releases (or workflow_dispatch with an explicit tag_name).

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Decide whether to push
        id: push
        run: |
          if [ "${{ startsWith(github.ref, 'refs/tags/v') || inputs.tag_name != '' }}" = "true" ]; then
            echo "push=true"  >> "$GITHUB_OUTPUT"
          else
            echo "push=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GHCR
        if: steps.push.outputs.push == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        run: |
          set -eu
          tag="${{ inputs.tag_name != '' && inputs.tag_name || github.ref_name }}"
          # Fall back to a dev tag for build-only runs so docker doesn't
          # complain about an empty tag value during validation builds.
          if [ -z "$tag" ] || [ "$tag" = "main" ]; then
            tag="dev-$(date -u +%Y%m%d-%H%M%S)"
          fi
          repo_lc="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          image="ghcr.io/${repo_lc}/kenshi-online-server"
          if [ "${{ steps.push.outputs.push }}" = "true" ]; then
            {
              echo "TAGS<<EOF"
              echo "${image}:${tag}"
              echo "${image}:latest"
              echo "EOF"
            } >> "$GITHUB_ENV"
          else
            echo "TAGS=${image}:${tag}" >> "$GITHUB_ENV"
          fi

      - name: Build (and push if tagged)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: ${{ steps.push.outputs.push == 'true' }}
          tags: ${{ env.TAGS }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
